hoose the smallest complete workflow, then make each selected capability testable.","fastDesc4":"Review the scope, adjust practical build choices if needed, and generate the handoff.","fastCoachTitle0":"Stay with the problem.","fastCoachText0":"A feature is easier to judge once you know who is struggling, what is happening today, and what better looks like.","fastCoachTitle1":"Capture before you filter.","fastCoachText1":"Do not prioritize while brainstorming. A messy idea list is useful raw material for the next step.","fastCoachTitle2":"Importance is not urgency.","fastCoachText2":"MoSCoW answers whether it belongs in version one. Urgency asks what happens if it waits. Dependencies ask what must exist first.","fastCoachTitle3":"A first build should complete a loop.","fastCoachText3":"Prefer a small end-to-end workflow over three disconnected features. Then define what success looks like for each part.","fastCoachTitle4":"The prompt is the handoff.","fastCoachText4":"The value came from the decisions you made before this screen. The generated prompt simply carries those decisions into the coding tool.","fastSidebarNote":"Answer normal questions. BuildBrief quietly turns them into product decisions.","fastWhyTitle":"What are you trying to improve?","fastWhyHint":"Keep it simple. You are defining the problem, person, and outcome - not designing the solution yet.","goDeeper":"Go deeper (optional)","goDeeperWhyHint":"These BA questions add useful context without blocking the fast path.","noChangeImpact":"What happens if nothing changes?","noChangePlaceholder":"e.g. Follow-ups keep getting missed and someone has to manually check every lead.","fastIdeasTitle":"What should the tool help someone do?","fastIdeasHint":"Add one capability per line. Think in actions, not screens: create, find, assign, send, approve, track.","fastIdeaPlaceholder":"Create a customer record\nCreate an estimate\nSend the estimate\nTrack whether it was approved","fastIdeaTip":"One capability per line. You can edit them after adding.","ideasDeepHint":"Need more detail? Edit any idea and add context, edge cases, data, or business rules. The fast path only needs a clear capability name.","fastPrioritizeKicker":"Three questions per idea","fastPrioritizeTitle":"Narrow the scope without losing the good ideas.","fastPrioritizeHint":"Answer what belongs now, what truly cannot wait, and what depends on something else.","priorityQuestion":"Could version 1 still solve the core problem without this?","priorityQuestionHint":"Use MoSCoW as a decision, not a score. \"Not this time\" keeps the idea without putting it in the first build.","urgencyQuestion":"What happens if this waits?","dependencyQuestion":"Does this need another capability first?","fastFirstBuildKicker":"MVP as a complete workflow","fastFirstBuildHint":"Choose up to three capabilities that work together from start to useful outcome. Then make them build-ready.","fastStoriesLabel":"Make the selected capabilities build-ready","buildReadyDetails":"Capability","roleQuestion":"Who is doing this?","actionQuestion":"What do they need to do?","benefitQuestion":"Why does that matter?","acceptanceQuestion":"How will you know it works?","acceptanceHelp":"Add at least one observable check. Think about success, missing information, and what should remain saved.","practicalOptional":"Build details (optional unless they change the solution)","practicalOptionalHint":"The defaults are enough for a simple prototype. Open this when the app needs shared data, multiple users, sensitive information, or specific technical constraints.","fastGenerateTitle":"Your first-build handoff is ready.","fastGenerateHint":"Approve the scope, choose where you will paste the prompt, and generate the handoff.","approvePlan":"I approve this first-build scope and its acceptance checks.","readySmall":"Ready","needsAnswers":"Needs answers"}},"es":{"native":"Español","dir":"ltr","strings":{"tagline":"PIENSA PRIMERO. CREA MEJOR.","yourJourney":"Tu camino hacia la primera versión","smallScope":"Menos alcance. Más progreso.","sidebarNote":"No necesitas ser experto en producto. Solo un lugar para empezar.","localWorkspace":"Espacio local · sin cuenta","workspace":"Espacio de trabajo","untitled":"Proyecto sin título","saved":"Guardado en este dispositivo","saveUnavailable":"No se puede guardar","storageWarning":"El almacenamiento del navegador no está disponible. Exporta tu proyecto antes de cerrar. No hay copia en la nube.","language":"Idioma de la interfaz","menu":"Abrir navegación","projectActions":"Opciones del proyecto","stepOf":"PASO {n} DE 8","guided":"Un poco de claridad ayuda mucho","step0":"Encuentra tu porqué","step1":"Reúne tus ideas","step2":"Decide qué importa","step3":"Revisa la urgencia","step4":"Elige tu primera versión","step5":"Define el éxito","step6":"Fija los límites","step7":"Obtén tu prompt","title0":"Una idea más clara.\nUna primera versión mejor.","title1":"Todas las ideas caben.\nLuego las acotamos.","title2":"Todo puede importar.\nNo todo va primero.","title3":"Importante no siempre\nsignifica urgente.","title4":"Empieza pequeño.\nHazlo útil.","title5":"Convierte funciones\nen expectativas claras.","title6":"Unos detalles prácticos.\nMenos sorpresas después.","title7":"Tu idea, organizada.\nTu próximo paso, listo.","desc0":"Antes de pensar en funciones y pantallas, aclaremos el problema. No necesitas lenguaje técnico.","desc1":"Saca tus ideas de la cabeza. Añade una función por línea; después podrás editarlas y organizarlas.","desc2":"Clasifica para esta primera versión, no para siempre. Una función imprescindible es aquella sin la que la solución no funciona.","desc3":"Busca fechas reales, consecuencias y dependencias. El entusiasmo por sí solo no crea urgencia.","desc4":"Elige hasta tres capacidades que completen un proceso útil. Guarda las demás para después.","desc5":"Explica quién necesita cada función, qué quiere hacer y por qué. Luego decide cómo comprobarás que funciona.","desc6":"Decide dónde funcionará, qué se guardará y quién lo usará. Estas decisiones serán instrucciones explícitas.","desc7":"Revisa tus decisiones antes de generar el documento. El prompt debe describir exactamente la versión aprobada.","foundation":"La base","basicsTitle":"¿Qué vamos a crear?","basicsHint":"Empieza por el problema. La solución puede evolucionar.","projectName":"Ponle nombre a tu idea","projectPlaceholder":"Ej. Una forma más tranquila de organizar las tareas","primaryUser":"¿Para quién es?","userPlaceholder":"Ej. Una persona que organiza un hogar ocupado","problem":"¿Qué problema quieres resolver?","problemPlaceholder":"¿Qué resulta frustrante, lento, confuso o fácil de olvidar?","workaround":"¿Cómo se resuelve hoy?","workaroundPlaceholder":"Ej. Notas adhesivas, mensajes o intentando recordarlo","outcome":"¿Cómo sería un día mejor?","outcomePlaceholder":"Describe el resultado, no una lista de funciones.","optional":"Opcional","whyTip":"Prueba: «Ayudar a [persona] a [acción] para que pueda [beneficio]».","back":"Atrás","next":"Continuar","footnote":"Tu trabajo queda en este navegador. Exporta una copia para conservarlo.","snapshot":"Tu proyecto de un vistazo","purpose":"El porqué","snapshotEmpty":"Tu idea tomará forma aquí a medida que avances.","ideas":"Ideas","inScope":"Para ahora","later":"Para después","coach":"Un poco de criterio de producto","coachTitle0":"Empieza por la dificultad.","coachText0":"«Necesito una app» es una solución. «Olvido las tareas» es un problema. Lo segundo es un mejor punto de partida.","coachTitle1":"Da espacio a las ideas sueltas.","coachText1":"Todavía no necesitas requisitos perfectos. Captura las ideas y luego decide cuáles entran en la primera versión.","coachTitle2":"Pon a prueba lo imprescindible.","coachText2":"¿Se puede resolver el problema original sin esta función? Si la respuesta es sí, quizá sea importante pero no imprescindible.","coachTitle3":"Pregunta qué pasa si espera.","coachText3":"Una fecha necesita un motivo. Una dependencia necesita una conexión. Separa urgencia e importancia.","coachTitle4":"Completa un ciclo.","coachText4":"Añadir una tarea → verla → completarla es un proceso útil. Tres funciones desconectadas no lo son.","coachTitle5":"Haz que el éxito sea comprobable.","coachText5":"«Funciona bien» es difícil de probar. «La tarea sigue guardada después de actualizar» es algo concreto.","coachTitle6":"Guardar no es compartir.","coachText6":"Este navegador, otro dispositivo y todo un equipo son requisitos distintos. Explica qué necesitas.","coachTitle7":"El prompt es un punto de partida.","coachText7":"Prueba el resultado con tus criterios. Una pantalla bonita no demuestra que el guardado o las integraciones funcionen.","localNotice":"Frontend local. Sin servicio de IA, cuenta ni sincronización en la nube.","tryExample":"Explorar un ejemplo","brainstorm":"El aparcamiento de ideas","addIdeas":"Añade tus ideas","ideaPlaceholder":"Añadir una tarea con fecha\nVer lo que toca hoy\nMarcar una tarea como completada","addFeatures":"Añadir funciones","featuresCount":"{n} ideas capturadas","emptyIdeas":"Todo buen proyecto empieza con una idea.","emptyIdeasHint":"Añade tu primera función arriba. Puedes cambiarla en cualquier momento.","edit":"Editar","remove":"Eliminar","featureTitle":"Función","featureDetails":"Un poco más de detalle","saveChanges":"Guardar cambios","cancel":"Cancelar","close":"Cerrar","must":"Imprescindible","should":"Importante","could":"Deseable","wont":"Esta vez no","unclassified":"Sin clasificar","mustHint":"Sin ella no se resuelve el problema.","shouldHint":"Importante, pero existe una alternativa.","couldHint":"Útil, pero no necesaria para empezar.","wontHint":"Conserva la idea fuera de esta versión.","moscow":"MoSCoW, sin tecnicismos","mustChallenge":"{n} funciones imprescindibles son muchas para empezar. ¿Qué pasa si dejas fuera cada una?","timing":"¿Cuándo se necesita?","noDeadline":"Sin fecha fija","soon":"Sensible al tiempo","fixed":"Fecha límite fija","deadline":"Fecha límite","consequence":"¿Qué pasa si espera?","consequencePlaceholder":"Explica la consecuencia real, no solo «lo antes posible».","dependencies":"¿Necesita otra función primero?","noDependencies":"No hay otras funciones disponibles.","triageReviewed":"He revisado los plazos y las dependencias.","scopeTitle":"Tu versión útil más pequeña","scopeCount":"{n} seleccionadas · intenta no superar 3","suggest":"Sugerir un alcance inicial","suggestHint":"Las sugerencias siguen reglas basadas en tus categorías, plazos y dependencias. Tú decides.","moveUp":"Subir","moveDown":"Bajar","workflow":"El proceso completo del usuario","workflowPlaceholder":"Ej. Añadir tarea → ver pendientes → completarla","workflowConfirmed":"Una persona puede completar la tarea principal con estas funciones.","exception":"Una primera versión más grande","exceptionApprove":"Apruebo una primera versión con más de tres funciones.","exceptionReason":"¿Por qué es necesario ampliar el alcance?","exceptionHint":"Explica por qué no se puede completar el proceso principal con menos funciones.","dependencyMissing":"«{feature}» necesita «{dependency}», que no está seleccionada.","mustMissing":"«{feature}» es imprescindible pero no está seleccionada. Inclúyela o cambia su categoría.","cycle":"Hay una dependencia circular. Elimina una conexión antes de continuar.","selectedFeatures":"Funciones seleccionadas, en orden","otherIdeas":"Fuera de la primera versión","story":"Historia de usuario","asA":"Como…","iWant":"Quiero…","soThat":"Para…","draftStory":"Crear borrador con mis respuestas","draftNotice":"Este borrador usa una plantilla, no análisis de IA. Edítalo y añade criterios comprobables antes de aprobarlo.","acceptance":"¿Cómo sabrás que funciona?","acceptanceHint":"Concreta qué pasa cuando todo sale bien, cuando falta información y qué se guarda.","addCheck":"Añadir criterio","checkPlaceholder":"Ej. Al guardar, la nueva tarea aparece con su fecha correcta.","storyApproved":"He revisado esta historia y sus criterios de aceptación.","practical":"Preferencias del proyecto","platform":"¿Dónde debe funcionar?","responsive":"Sitio web adaptable al móvil","desktop":"Navegador de escritorio","mobile":"Navegador del teléfono","dataMode":"¿Qué debe ocurrir con los datos?","noSave":"Prototipo sin datos guardados","browserSave":"Guardar solo en este navegador","sharedSave":"Compartir entre dispositivos o personas","audience":"¿Quién usará la aplicación final?","justMe":"Solo yo","team":"Grupo o equipo invitado","public":"Cualquier persona","access":"¿Quién puede ver o modificar los datos?","accessPlaceholder":"Ej. Cada usuario identificado solo puede ver y editar sus propios registros.","sensitive":"¿Gestionará información personal o sensible?","noSensitive":"No se prevén datos sensibles","yesSensitive":"Información personal o sensible","design":"¿Qué aspecto y sensación debe tener?","designPlaceholder":"Ej. Tranquilo, sencillo, legible y con botones grandes","constraints":"Otros límites o elementos que conservar","constraintsPlaceholder":"Ej. Ningún servicio de pago sin aprobación. Conservar la aplicación existente.","targetTool":"¿Dónde pegarás el prompt?","targetPlaceholder":"Escribe tu asistente de programación o déjalo vacío","sharedWarning":"Los datos compartidos necesitan un backend o almacenamiento compartido en la aplicación final. Este frontend de planificación no los proporciona.","sensitiveWarning":"No introduzcas datos sensibles reales aquí. La aplicación final necesitará acceso y almacenamiento adecuados, no un atajo basado solo en el navegador.","practicalReviewed":"He revisado estas decisiones sobre datos, acceso y desarrollo.","review":"Resumen de tu primera versión","reviewHint":"Revisa el plan. Puedes volver a cualquier paso sin perder tu trabajo.","readiness":"Antes de crear","ready":"Tu plan está listo para revisar.","notReady":"Todavía quedan algunas decisiones.","approvedScope":"Apruebo este alcance y las exclusiones indicadas.","promptLanguage":"Instrucciones del prompt","english":"Inglés","interfaceLanguage":"Idioma actual de la interfaz","translationNote":"Tus respuestas mantienen su idioma original.","generate":"Generar mi prompt","regenerate":"Regenerar prompt","promptReady":"Un punto de partida más claro.","promptReadyHint":"Copia el prompt en tu asistente de programación y verifica el resultado con tus criterios.","buildPrompt":"Prompt de desarrollo","productBrief":"Resumen del producto","featurePrompts":"Una función cada vez","copy":"Copiar","download":"Descargar","export":"Exportar proyecto","import":"Importar proyecto","newProject":"Nuevo proyecto","loadExample":"Cargar proyecto de ejemplo","localPrivacy":"Los proyectos se guardan solo en este navegador. Quien tenga acceso a este perfil podría verlos. Exporta una copia JSON para cambiar de dispositivo.","replaceTitle":"¿Reemplazar el proyecto actual?","replaceBody":"Se reemplazará el proyecto de este navegador. Exporta antes una copia para conservar tu trabajo.","replace":"Reemplazar proyecto","deleteTitle":"¿Eliminar esta función?","deleteBody":"También se eliminarán su historia, criterios y dependencias. No se puede deshacer.","stale":"Tu plan ha cambiado. Revísalo y regenera el prompt antes de copiarlo.","copied":"Copiado al portapapeles.","copyFallback":"El portapapeles está bloqueado. Selecciona y copia el texto o descárgalo.","exported":"Proyecto exportado.","imported":"Proyecto importado.","invalidImport":"El archivo no es un proyecto válido de BuildBrief. Tu trabajo no se ha cambiado.","tooLarge":"El archivo es demasiado grande. Máximo: 2 MB.","added":"Se añadieron {n} funciones.","duplicates":"Se omitieron ideas vacías o duplicadas.","maxFeatures":"Mantén el proyecto en 60 funciones o menos.","checkDecisions":"Revisa estas decisiones","error0":"Añade nombre, usuario previsto, problema y resultado deseado.","error1":"Añade al menos una función.","error2":"Clasifica todas las funciones y marca al menos una como imprescindible.","error3":"Explica los elementos urgentes, añade sus fechas y confirma la revisión.","error4":"Elige una primera versión coherente, describe su proceso y confirma que está completo.","errorException":"Para superar tres funciones, aprueba el alcance ampliado y explica el motivo.","error5":"Completa y revisa cada historia seleccionada, con al menos un criterio no vacío.","error6":"Revisa los detalles prácticos. Para datos compartidos, multiusuario o sensibles, define los permisos.","error7":"Revisa el plan y aprueba el alcance antes de generar.","nextFeature":"Siguiente función","approveAgain":"Se ha restablecido la aprobación porque el plan cambió.","selectFeature":"Elige una función","suggested":"Se ha sugerido un alcance inicial. Revisa las opciones y completa el proceso.","exampleLoaded":"Ejemplo cargado. Puedes editar todo su contenido.","featureEmpty":"Ponle nombre a la función.","skip":"Ir al contenido","promptIntro":"Crea la primera versión de la aplicación descrita a continuación.","promptContext":"PROPÓSITO DEL PROYECTO","promptScope":"ALCANCE APROBADO DE LA PRIMERA VERSIÓN","promptWorkflow":"PROCESO PRINCIPAL DEL USUARIO","promptStories":"HISTORIAS DE USUARIO Y CRITERIOS DE ACEPTACIÓN","promptData":"DISEÑO, DATOS, ACCESO Y RESTRICCIONES","promptExcluded":"FUERA DE ALCANCE — NO IMPLEMENTAR","promptInstructions":"INSTRUCCIONES DE IMPLEMENTACIÓN","promptVerify":"VERIFICACIÓN","promptInstructionText":"Antes de crear, revisa el proceso para detectar conflictos y dependencias faltantes. Usa la implementación más sencilla que cumpla los requisitos aprobados. Plantea las decisiones pendientes que afecten materialmente a funcionalidad, coste, seguridad o acceso a datos antes de resolverlas. No añadas funciones sin aprobación. Trabaja en incrementos pequeños y comprobables. Conserva el comportamiento existente al modificar una aplicación. Incluye estados vacíos, de carga, de éxito y de error adecuados.","promptVerifyText":"Comprueba cada criterio de aceptación. Indica qué se implementó, qué se probó, qué no pudo probarse y qué configuración o limitaciones quedan. No afirmes que el almacenamiento, las integraciones, la seguridad o el despliegue funcionan sin verificarlo. Un prototipo visual no sustituye la funcionalidad real requerida.","promptNoExcluded":"No se aprueban funciones adicionales fuera del alcance anterior.","promptShared":"Implementa almacenamiento compartido adecuado en la aplicación final. El almacenamiento local del navegador no cumple este requisito. Confirma arquitectura, autenticación, permisos y costes antes de desplegar.","promptSensitive":"Usa autenticación, autorización y protección de almacenamiento adecuadas. No incluyas secretos en el frontend. No uses datos sensibles reales en el prototipo.","promptLocal":"Se requiere persistencia solo en el mismo navegador. No la describas como almacenamiento compartido o sincronización en la nube. Explica las limitaciones y el riesgo de pérdida de datos.","promptPrototype":"Es un prototipo sin persistencia. Identifica los datos de ejemplo y los cambios no guardados. No sugieras que la información permanecerá tras recargar.","promptIncrement":"CREAR SOLO ESTE INCREMENTO","promptIncrementText":"Implementa únicamente la función siguiente conservando el contexto y las exclusiones del proyecto. Comprueba primero sus dependencias. No añadas requisitos previos faltantes ni otras funciones sin avisar; explica los bloqueos y solicita una decisión de alcance.","none":"No especificado","scopeException":"Excepción de alcance aprobada","backupFirst":"Exportar una copia antes","detailLimit":"Describe una sola capacidad en cada idea."}},"fr":{"native":"Français","dir":"ltr","strings":{"tagline":"PENSEZ D’ABORD. CRÉEZ MIEUX.","yourJourney":"Votre parcours de création","smallScope":"Petit périmètre. Vrais progrès.","sidebarNote":"Pas besoin d’être expert produit. Il vous faut simplement un point de départ.","localWorkspace":"Espace local · sans compte","workspace":"Espace de travail","untitled":"Projet sans titre","saved":"Enregistré sur cet appareil","saveUnavailable":"Enregistrement indisponible","storageWarning":"Le stockage du navigateur est indisponible. Exportez votre projet avant de fermer. Aucune sauvegarde dans le cloud.","language":"Langue de l’interface","menu":"Ouvrir la navigation","projectActions":"Options du projet","stepOf":"ÉTAPE {n} SUR 8","guided":"Un peu de clarté change tout","step0":"Trouvez votre pourquoi","step1":"Rassemblez vos idées","step2":"Décidez de l’essentiel","step3":"Évaluez l’urgence","step4":"Choisissez la première version","step5":"Définissez la réussite","step6":"Posez les limites","step7":"Obtenez votre prompt","title0":"Une idée plus claire.\nUne meilleure première version.","title1":"Toutes les idées sont bienvenues.\nOn fera le tri ensuite.","title2":"Tout peut compter.\nTout ne passe pas en premier.","title3":"Important ne veut pas\ntoujours dire urgent.","title4":"Commencez petit.\nRendez-le utile.","title5":"Transformez les fonctionnalités\nen attentes précises.","title6":"Quelques détails pratiques.\nMoins de surprises ensuite.","title7":"Votre idée, structurée.\nLa suite, prête.","desc0":"Avant les fonctionnalités et les écrans, clarifions le problème. Aucun jargon technique nécessaire.","desc1":"Libérez vos idées. Ajoutez une fonctionnalité par ligne ; vous pourrez ensuite les modifier et les organiser.","desc2":"Classez pour cette première version, pas pour toujours. Un indispensable est quelque chose sans lequel la solution ne fonctionne pas.","desc3":"Cherchez de vraies échéances, conséquences et dépendances. L’enthousiasme seul ne crée pas l’urgence.","desc4":"Choisissez jusqu’à trois capacités formant un parcours utile complet. Gardez les autres pour plus tard.","desc5":"Précisez qui a besoin de chaque fonctionnalité, pour faire quoi et pourquoi. Définissez ensuite comment la vérifier.","desc6":"Décidez où l’application fonctionne, ce qu’elle enregistre et qui l’utilise. Ces choix deviennen const BB_DEMOS = {"en":{"basics":["Everyday, a little lighter","person managing household chores","Chores live in sticky notes and messages. I forget what is due and cannot see what is already done.","A mix of sticky notes, reminders, and memory.","Know what needs doing today and finish chores without keeping everything in my head.","Add a chore with a due date → see what is due → mark it complete"],"features":[["Add a chore with a due date","add a chore and choose its due date","I can remember what needs doing and when",["A chore cannot be saved without a name and a valid due date.","Saving a valid chore adds it to the list with the name and date entered.","The saved chore remains available after refreshing the same browser."]],["See what needs doing today","see today's and overdue chores together","I can decide what to work on next",["Incomplete chores due today or earlier appear in the Today view.","Future chores do not appear in the Today view.","When no chores are due, the view explains that there is nothing to do."]],["Mark a chore complete","mark a chore as complete","I can see my progress and avoid doing the same task twice",["Marking a chore complete removes it from the active Today view.","The completed state remains after refreshing the same browser.","A completed chore can be restored to incomplete."]],["Make chores repeat automatically","","",[]],["Add family points and badges","","",[]],["Send push notifications","","",[]]],"design":"Calm and readable. Warm white, deep green, large buttons, and simple navigation.","constraints":"Start with one person using one browser. No accounts, paid services, or notifications in version one."},"es":{"basics":["Un día más ligero","persona que organiza las tareas del hogar","Las tareas están repartidas entre notas y mensajes. Olvido lo pendiente y no sé qué está terminado.","Notas adhesivas, recordatorios y memoria.","Saber qué toca hoy y terminar las tareas sin tener que recordarlo todo.","Añadir una tarea con fecha श करने के बाद काम उपलब्ध रहता है।"]],["आज के काम देखना","आज के काम देखना","मैं अगला काम चुन सकूं",["आज के दृश्य में आज और पहले के अधूरे काम दिखते हैं।","आने वाली तारीखों के काम आज के दृश्य में नहीं दिखते।","कोई काम न होने पर दृश्य स्पष्ट बताता है कि कुछ बाकी नहीं है।"]],["काम को पूरा चिह्नित करना","काम को पूरा चिह्नित करना","मैं प्रगति देख सकूं और काम न दोहराऊं",["पूरा करने पर काम आज की सक्रिय सूची से हटता है।","ब्राउज़र रिफ्रेश के बाद पूरा होने की स्थिति बनी रहती है।","पूरा काम फिर से अधूरा किया जा सकता है।"]],["काम को अपने आप दोहराना","","",[]],["परिवार के लिए अंक और बैज जोड़ना","","",[]],["पुश सूचनाएं भेजना","","",[]]],"design":"शांत और पढ़ने में आसान। हल्की पृष्ठभूमि, गहरा हरा, बड़े बटन और सरल नेविगेशन।","constraints":"एक ब्राउज़र में एक व्यक्ति। पहले संस्करण में खाते, भुगतान सेवाएं या सूचनाएं नहीं।"},"ja":{"basics":["毎日を少し軽く","家事を管理する人","家事がメモとメッセージに散らばり、期限や完了したものを忘れてしまいます。","付箋、リマインダー、記憶。","今日やることが分かり、すべてを覚えていなくても家事を終えられること。","期限付きの家事を追加 → 期限を確認 → 完了にする"],"features":[["期限付きの家事を追加する","期限付きの家事を追加する","何をいつ行うか覚えておくため",["名前と有効な期限がない家事は保存できません。","保存すると入力した名前と期限で一覧に表示されます。","同じブラウザーの再読み込み後も家事が残ります。"]],["今日やることを確認する","今日やることを確認する","次に取り組むことを選ぶため",["今日の画面には、本日以前が期限の未完了の家事が表示されます。","未来が期限の家事は今日の画面に出ません。","該当する家事がなければ、何もないことが明確に表示されます。"]],["家事を完了にする","家事を完了にする","進捗を確認して作業の重複を防ぐため",["完了にすると今日の未完了一覧から消えます。","同じブラウザーの再読み込み後も完了状態が残ります。","完了した家事を未完了に戻せます。"]],["家事を自動で繰り返す","","",[]],["家族のポイントとバッジを追加する","","",[]],["プッシュ通知を送る","","",[]]],"design":"落ち着いて読みやすく。明るい背景、深緑、大きなボタン、簡単なナビゲーション。","constraints":"一人が一つのブラウザーで使用。初回はアカウント、有料サービス、通知なし。"},"ko":{"basics":["하루를 조금 더 가볍게","집안일을 관리하는 사람","집안일이 메모와 메시지에 흩어져 있습니다. 기한을 잊고 무엇을 끝냈는지 알기 어렵습니다.","메모지, 알림, 기억에 의존합니다.","오늘 할 일을 알고 모든 것을 기억하지 않아도 집안일을 끝내는 것.","기한 있는 집안일 추가 → 해야 할 일 확인 → 완료 표시"],"features":[["기한이 있는 집안일 추가","기한이 있는 집안일 추가","무엇을 언제 해야 하는지 기억하기",["이름과 유효한 기한이 없으면 저장할 수 없습니다.","저장한 집안일은 입력한 이름과 날짜로 표시됩니다.","같은 브라우저를 새로고침해도 집안일이 남습니다."]],["오늘 할 일 보기","오늘 할 일 보기","다음에 할 일을 선택하기",["오늘 화면에는 오늘 또는 이전이 기한인 미완료 집안일이 표시됩니다.","미래의 집안일은 오늘 화면에 표시되지 않습니다.","할 일이 없으면 화면에서 명확히 알려 줍니다."]],["집안일을 완료로 표시","집안일을 완료로 표시","진행 상황을 보고 중복 작업을 피하기",["완료로 표시하면 오늘의 활성 목록에서 사라집니다.","새로고침 후에도 완료 상태가 유지됩니다.","완료된 집안일을 미완료로 되돌릴 수 있습니다."]],["집안일 자동 반복","","",[]],["가족 점수와 배지 추가","","",[]],["푸시 알림 보내기","","",[]]],"design":"차분하고 읽기 쉽게. 밝은 배경, 짙은 녹색, 큰 버튼, 간단한 탐색.","constraints":"한 사람이 한 브라우저에서 사용. 첫 버전은 계정, 유료 서비스, 알림 제외."},"zh-CN":{"basics":["让每一天轻松一点","管理家务的人","家务散落在便签和消息中。我会忘记截止日期，也不清楚哪些已经完成。","便利贴、提醒，以及靠记忆。","知道今天该做什么，不必把所有家务都记在脑中。","添加带期限的家务 → 查看待办 → 标记完成"],"features":[["添加带截止日期的家务","添加带截止日期的家务","记住需要做什么以及何时完成",["没有名称或有效日期时，不能保存家务。","保存成功后，家务以输入的名称和日期出现在列表中。","刷新同一浏览器后，家务仍然保留。"]],["查看今天要做的事","查看今天要做的事","决定接下来做什么",["今天视图显示截止日期为今天或更早的未完成家务。","未来的家务不显示在今天视图中。","没有待办时，页面明确说明没有需要完成的事项。"]],["把家务标记为完成","把家务标记为完成","看到进度并避免重复劳动",["标记完成后，该家务从今天的待办列表中移除。","刷新同一浏览器后，完成状态仍保留。","已完成的家务可以恢复为未完成。"]],["自动重复家务","","",[]],["添加家庭积分和徽章","","",[]],["发送推送通知","","",[]]],"design":"安静、易读。浅色背景、深绿色、大按钮和简单导航。","constraints":"一个人在一个浏览器中使用。首版不含账号、付费服务或通知。"},"vi":{"basics":["Mỗi ngày nhẹ nhàng hơn","người quản lý việc nhà","Việc nhà nằm rải rác trong ghi chú và tin nhắn. Tôi quên hạn và không biết việc nào đã xong.","Giấy ghi chú, nhắc nhở và trí nhớ.","Biết việc cần làm hôm nay mà không phải nhớ mọi thứ.","Thêm việc có hạn → xem việc cần làm → đánh dấu hoàn thành"],"features":[["Thêm việc nhà có hạn chót","Thêm việc nhà có hạn chót","nhớ việc gì cần làm và khi nào",["Không thể lưu việc thiếu tên hoặc ngày hợp lệ.","Việc đã lưu hiện đúng tên và ngày đã nhập.","Việc vẫn còn sau khi tải lại cùng trình duyệt."]],["Xem việc cần làm hôm nay","Xem việc cần làm hôm nay","chọn việc tiếp theo",["Màn hình hôm nay hiển thị việc chưa xong đến hạn hôm nay hoặc đã trễ.","Việc tương lai không xuất hiện trong màn hình hôm nay.","Nếu không có việc, màn hình nói rõ không còn việc cần làm."]],["Đánh dấu việc đã hoàn thành","Đánh dấu việc đã hoàn thành","thấy tiến độ và không làm trùng việc",["Đánh dấu hoàn thành sẽ bỏ việc khỏi danh sách đang làm hôm nay.","Trạng thái hoàn thành giữ nguyên sau khi tải lại.","Có thể chuyển việc đã xong về chưa hoàn thành."]],["Tự động lặp lại việc nhà","","",[]],["Thêm điểm và huy hiệu gia đình","","",[]],["Gửi thông báo đẩy","","",[]]],"design":"Nhẹ nhàng, dễ đọc. Nền sáng, xanh đậm, nút lớn, điều hướng đơn giản.","constraints":"Một người trên một trình duyệt. Không tài khoản, dịch vụ trả phí hay thông báo trong bản đầu."},"id":{"basics":["Hari yang sedikit lebih ringan","orang yang mengatur pekerjaan rumah","Tugas tersebar di catatan dan pesan. Saya lupa tenggat dan tidak tahu mana yang sudah selesai.","Catatan tempel, pengingat, dan ingatan.","Mengetahui tugas hari ini tanpa harus mengingat semuanya.","Tambah tugas bertanggal → lihat yang perlu dikerjakan → tandai selesai"],"features":[["Tambah tugas dengan tanggal","Tambah tugas dengan tanggal","saya mengingat apa yang perlu dilakukan dan kapan",["Tugas tanpa nama dan tanggal valid tidak dapat disimpan.","Tugas tersimpan muncul dengan nama dan tanggal yang dimasukkan.","Tugas tetap ada setelah browser yang sama dimuat ulang."]],["Lihat tugas hari ini","Lihat tugas hari ini","saya bisa memilih tugas berikutnya",["Tampilan hari ini memuat tugas belum selesai yang jatuh tempo hari ini atau sebelumnya.","Tugas mendatang tidak muncul di tampilan hari ini.","Jika tidak ada tugas, tampilan menjelaskan bahwa tidak ada yang perlu dikerjakan."]],["Tandai tugas selesai","Tandai tugas selesai","saya melihat kemajuan tanpa mengulang pekerjaan",["Menandai selesai menghapus tugas dari daftar aktif hari ini.","Status selesai tetap ada setelah memuat ulang browser.","Tugas selesai bisa dikembalikan menjadi belum selesai."]],["Ulangi tugas secara otomatis","","",[]],["Tambahkan poin dan lencana keluarga","","",[]],["Kirim notifikasi push","","",[]]],"design":"Tenang dan mudah dibaca. Latar terang, hijau tua, tombol besar, navigasi sederhana.","constraints":"Satu orang dalam satu browser. Tanpa akun, layanan berbayar, atau notifikasi dalam versi pertama."}};

Do not create fake buttons, placeholder integrations, simulated persistence, or interface elements that imply functionality that has not actually been implemented. If infrastructure, credentials, APIs, permissions, licenses, or another prerequisite is missing, identify the blocker and the exact next step instead of silently substituting mock behavior.

SCOPE CONTROL
Build only the approved first-version scope. Treat OUT OF SCOPE as intentionally deferred. Do not add dashboards, admin panels, authentication, notifications, analytics, integrations, settings, onboarding, or other common product features unless they are explicitly approved or technically necessary for the approved workflow. If a technically necessary prerequisite expands scope, explain why before implementing it.

IMPLEMENTATION APPROACH
Use the simplest maintainable implementation that satisfies the approved requirements. Build in small, testable increments. Preserve existing behavior when modifying an existing application. Include appropriate empty, loading, success, validation, and error states.`;

  function makePrompt(lang,incrementId=null){
    const L=(key,vars)=>tr(lang,key,vars), p=project.prefs;
    const line=(key,value)=>`${L(key)}: ${value||L('none')}`;
    const selected=selectedFeatures();
    const numbered=selected.map((f,i)=>`${i+1}. [F${project.features.indexOf(f)+1}] ${f.title}`).join('\n');
    const stories=(incrementId?selected.filter(f=>f.id===incrementId):selected).map(f=>{
      const deps=f.dependsOn.map(id=>featureById(id)?.title).filter(Boolean);
      return `[F${project.features.indexOf(f)+1}] ${f.title}\n${f.details?f.details+'\n':''}${L('asA').replace(/\u2026/g,'')} ${f.story.role}\n${L('iWant').replace(/\u2026/g,'')} ${f.story.action}\n${L('soThat').replace(/\u2026/g,'')} ${f.story.benefit}\n${L('acceptance')}\n${f.criteria.filter(c=>c.text.trim()).map((c,i)=>`  ${i+1}. ${c.text.trim()}`).join('\n')}\n${line('dependencies',deps.join('; '))}${f.urgency!=='noDeadline'?`\n${line('timing',L(f.urgency))}${f.urgency==='fixed'&&f.deadline?' - '+f.deadline:''}\n${line('consequence',f.consequence)}`:''}`;
    }).join('\n\n');
    const excluded=project.features.filter(f=>!project.selected.includes(f.id)).map(f=>`- ${f.title}`).join('\n')||L('promptNoExcluded');
    const text=[
      'You are the implementation owner for the first usable version of the product described below.',
      'Your goal is not to build the largest application possible. Your goal is to make the approved user workflow work completely from start to finish.',
      '',
      'BuildBrief | '+project.name,
      '',
      L('promptContext'),line('primaryUser',project.user),line('problem',project.problem),line('workaround',project.workaround),line('noChangeImpact',project.impact),line('outcome',project.outcome),
      '',
      L('promptScope'),numbered,
      ...(project.selected.length>3?['',line('scopeException',project.exceptionReason)]:[]),
      '',
      L('promptWorkflow'),workflowJourney(L),
      '',
      ...(incrementId?[L('promptIncrement'),featureById(incrementId)?.title||'',L('promptIncrementText'),'']:[]),
      L('promptStories'),stories,
      '',
      L('promptData'),line('platform',L(p.platform)),line('audience',L(p.audience)),line('dataMode',L(p.dataMode)),line('access',p.access),line('sensitive',L(p.sensitive)),line('design',p.design),line('constraints',p.constraints),line('targetTool',p.targetTool),
      '',
      L(p.dataMode==='sharedSave'?'promptShared':p.dataMode==='browserSave'?'promptLocal':'promptPrototype'),
      ...(p.sensitive==='yesSensitive'?[L('promptSensitive')]:[]),
      '',
      L('promptExcluded'),excluded,
      '',
      'DEFINITION OF DONE',definitionOfDone(p),
      '',
      targetExecutionGuidance(),
      '',
      L('promptInstructions'),implementationRules(),
      '',
      L('promptVerify'),
      'Verify the completed product against the CORE USER WORKFLOW, every acceptance criterion, and the DEFINITION OF DONE. Report what was implemented, what was tested, what could not be tested, and any remaining setup or limitations. Do not claim storage, integrations, security, deployment, or other functionality works unless you actually verified it.'
    ].join('\n');
    return text;
  }
  function makeBrief(lang){const L=(k,v)=>tr(lang,k,v);const p=project.prefs;
    return `# ${project.name}\n\n## ${L('purpose')}\n${project.problem}\n\n**${L('primaryUser')}:** ${project.user}\n\n**${L('workaround')}:** ${project.workaround||L('none')}\n\n**${L('outcome')}:** ${project.outcome}\n\n## ${L('selectedFeatures')}\n${selectedFeatures().map((f,i)=>`${i+1}. ${f.title}`).join('\n')}\n\n## ${L('workflow')}\n${project.workflow}\n\n${selectedFeatures().map(f=>`### ${f.title}\n${L('asA')} ${f.story.role}\n${L('iWant')} ${f.story.action}\n${L('soThat')} ${f.story.benefit}\n\n${L('acceptance')}\n${f.criteria.filter(c=>c.text.trim()).map(c=>'- [ ] '+c.text).join('\n')}`).join('\n\n')}\n\n## ${L('practical')}\n${['platform','dataMode','audience','sensitive'].map(k=>`${L(k)}: ${L(p[k])}`).join('\n')}\n${L('access')}: ${p.access||L('none')}\n${L('design')}: ${p.design||L('none')}\n${L('constraints')}: ${p.constraints||L('none')}\n${L('targetTool')}: ${p.targetTool||L('none')}\n${project.selected.length>3?'\n'+L('scopeException')+': '+project.exceptionReason+'\n':''}\n## ${L('otherIdeas')}\n${project.features.filter(f=>!project.selected.includes(f.id)).map(f=>'- '+f.title).join('\n')||L('none')}\n\n## ${L('promptVerify')}\n${L('promptVerifyText')}`;
  }

    project.generated={locale:lang,signature:fingerprint(),build:makePrompt(lang),brief:makeBrief(lang),features:Object.fromEntries(project.selected.map(id=>[id,makePrompt(lang,id)])),at:new Date().toISOString()};

  function addFeatures(){const raw=$('#idea-input').value;const lines=raw.split(/\r?\n/).map(x=>x.replace(/^\s*[-*\u2022]\s*/,'').trim()).filter(Boolean);if(!lines.length){$('#idea-input').focus();return;}const existing=new Set(project.features.map(f=>f.title.toLocaleLowerCase()));let added=0,skipped=0;

  function suggestScope(){
    const eligible=project.features.filter(f=>f.moscow!=='wont');
    const rank=f=>({must:100,should:40,could:10,'':0}[f.moscow]||0)+(f.urgency==='fixed'?12:f.urgency==='soon'?6:0);
    const sorted=[...eligible].sort((a,b)=>rank(b)-rank(a)||project.features.indexOf(a)-project.features.indexOf(b));
    const selected=[];const visited=new Set();
    const include=f=>{if(!f||visited.has(f.id))return;visited.add(f.id);for(const dep of f.dependsOn){const d=featureById(dep);if(d?.moscow!=='wont')include(d);}if(f.moscow!=='wont'&&!selected.includes(f.id))selected.push(f.id);};
    sorted.filter(f=>f.moscow==='must').forEach(include);
    for(const f of sorted){if(selected.length>=3)break;include(f);}

  }

  function normalizeProject(raw){
    if(!raw||raw.version!==1||!Array.isArray(raw.features)||raw.features.length>MAX_FEATURES||!raw.prefs)throw new Error('Invalid project');
    const p=emptyProject();
    const str=(value,max=4000)=>typeof value==='string'?value.slice(0,max):'';
    for(const key of ['name','user','problem','workaround','impact','outcome','workflow','exceptionReason'])p[key]=str(raw[key],key==='name'?160:4000);
    p.id=str(raw.id,100)||uid();
    for(const key of ['workflowConfirmed','exceptionApproved','triageReviewed','scopeApproved'])p[key]=raw[key]===true;
    p.promptLang=['en','interface'].includes(raw.promptLang)?raw.promptLang:'en';
    const idSet=new Set(),criterionIds=new Set();
    p.features=raw.features.map(f=>{
      if(!f||typeof f.title!=='string'||!f.title.trim())throw new Error('Invalid feature');
      const id=str(f.id,100);if(!/^[a-zA-Z0-9_-]{1,100}$/.test(id)||idSet.has(id))throw new Error('Invalid id');idSet.add(id);
      const feature=newFeature(str(f.title,220));feature.id=id;feature.details=str(f.details);
      feature.moscow=['must','should','could','wont',''].includes(f.moscow)?f.moscow:'';
      feature.urgency=['noDeadline','soon','fixed'].includes(f.urgency)?f.urgency:'noDeadline';feature.deadline=validDate(f.deadline)?f.deadline:'';feature.consequence=str(f.consequence,2000);
      feature.dependsOn=Array.isArray(f.dependsOn)?[...new Set(f.dependsOn.filter(x=>typeof x==='string'&&x!==id))].slice(0,MAX_FEATURES):[];
      feature.story={role:str(f.story?.role,2000),action:str(f.story?.action,2000),benefit:str(f.story?.benefit,2000)};
      feature.criteria=Array.isArray(f.criteria)?f.criteria.slice(0,30).map(c=>{let cid=str(c?.id,100);if(!/^[a-zA-Z0-9_-]{1,100}$/.test(cid)||criterionIds.has(cid))cid=uid();criterionIds.add(cid);return {id:cid,text:str(c?.text,2000)};}):[];
      if(!feature.criteria.length)feature.criteria=[{id:uid(),text:''}];feature.storyApproved=f.storyApproved===true;return feature;
    });
    for(const f of p.features)f.dependsOn=f.dependsOn.filter(id=>idSet.has(id));
    p.selected=Array.isArray(raw.selected)?[...new Set(raw.selected.filter(id=>idSet.has(id)&&p.features.find(f=>f.id===id).moscow!=='wont'))]:[];
    for(const [key,valid] of Object.entries({platform:['responsive','desktop','mobile'],dataMode:['noSave','browserSave','sharedSave'],audience:['justMe','team','public'],sensitive:['noSensitive','yesSensitive']}))if(valid.includes(raw.prefs[key]))p.prefs[key]=raw.prefs[key];
    for(const key of ['access','design','constraints','targetTool'])p.prefs[key]=str(raw.prefs[key],key==='targetTool'?200:4000);
    p.prefs.reviewed=raw.prefs.reviewed===true;
    if(raw.generated&&typeof raw.generated.build==='string'&&typeof raw.generated.brief==='string'&&typeof raw.generated.signature==='string'&&BB_LOCALES[raw.generated.locale]){
      p.generated={build:str(raw.generated.build,500000),brief:str(raw.generated.brief,300000),signature:str(raw.generated.signature,1000000),locale:raw.generated.locale,at:str(raw.generated.at,60),features:{}};
      for(const id of p.selected)if(typeof raw.generated.features?.[id]==='string')p.generated.features[id]=str(raw.generated.features[id],500000);
    }
    return p;
  }
  let pendingImport=null,pendingImportDraft='';
  async function handleImport(file){
    if(!file)return;if(file.size>2*1024*1024){toast(t('tooLarge'));return;}
    try{const parsed=JSON.parse(await file.text());if(parsed.app!=='BuildBrief'||parsed.version!==1)throw new Error('Invalid file');const imported=normalizeProject(parsed.project);imported.scopeApproved=false;imported.generated=null;
      pendingImport=imported;pendingImportDraft=typeof parsed.draftIdeas==='string'?parsed.draftIdeas.slice(0,15000):'';
      if(project.name||project.features.length){openDialog(t('replaceTitle'),`<p>${esc(t('replaceBody'))}</p><p><strong>${esc(imported.name||t('untitled'))}</strong></p>`,btn('backupFirst','export','download')+btn('cancel','close-dialog')+btn('replace','confirm-import','upload','btn-primary'));}
      else applyImport();
    }catch{toast(t('invalidImport'));}
  }
  function applyImport(){if(!pendingImport)return;project=pendingImport;pendingImport=null;step=0;uiDraft.ideas=pendingImportDraft;pendingImportDraft='';errors=[];closeDialog();persist();render({focus:true});toast(t('imported'));}
  document.addEventListener('click',e=>{if(e.target.closest('[data-action="confirm-import"]'))applyImport();});
  function exampleProject(){
    const p=emptyProject(), D=BB_DEMOS[locale]||BB_DEMOS.en;
    [p.name,p.user,p.problem,p.workaround,p.outcome,p.workflow]=D.basics;
    p.features=D.features.map((d,i)=>{const f=newFeature(d[0]);f.moscow=i<3?'must':i===3?'should':i===4?'could':'wont';f.story={role:p.user,action:d[1]||d[0],benefit:d[2]||p.outcome};f.criteria=(d[3]||[]).map(text=>({id:uid(),text}));if(!f.criteria.length)f.criteria=[{id:uid(),text:''}];f.storyApproved=i<3;return f;});
    p.features[1].dependsOn=[p.features[0].id];p.features[2].dependsOn=[p.features[0].id];p.selected=p.features.slice(0,3).map(f=>f.id);p.workflowConfirmed=true;p.triageReviewed=true;p.prefs.design=D.design;p.prefs.constraints=D.constraints;p.prefs.reviewed=true;return p;
  }
  function init(){
    try{const savedLocale=localStorage.getItem(LOCALE_KEY);if(BB_LOCALES[savedLocale])locale=savedLocale;const stored=localStorage.getItem(STORAGE_KEY);if(stored){const value=JSON.parse(stored);project=normalizeProject(value.project);uiDraft.ideas=typeof value.draftIdeas==='string'?value.draftIdeas.slice(0,15000):'';step=Number.isInteger(value.step)?Math.max(0,Math.min(4,value.step)):0;}}
    catch{storageOK=false;}
    project=project||emptyProject();
    outputFeature=project.selected[0]||'';
    render();
    try{localStorage.setItem('buildbrief.storage-test','1');localStorage.removeItem('buildbrief.storage-test');}catch{storageOK=false;updateSaveStatus();}
  }
  // Read-only diagnostics for local QA; no project data is sent anywhere.
  Object.defineProperty(window,'BuildBrief',{value:Object.freeze({version:'2.0.0',locales:()=>Object.keys(BB_LOCALES),getState:()=>JSON.parse(JSON.stringify({locale,step,project,storageOK})),issues:()=>allIssues(),stale:()=>isStale()})});
  init();
})();
</script>
